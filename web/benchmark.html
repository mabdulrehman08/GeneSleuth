<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeneSleuth · Benchmark</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/benchmark.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a href="/" class="brand">Gene<span>Sleuth</span></a>
      <nav aria-label="Project pages"><a href="/">Live investigation</a></nav>
    </div>
  </header>
  <main class="workspace">
    <div class="hero">
      <h1>Held-out benchmark</h1>
      <p>How often does the hidden variant reach the shortlist?</p>
    </div>
    <section class="surface" aria-label="Test-set results">
      <p id="benchmark-status" role="status">Loading test-set results…</p>
      <figure id="benchmark-figure" class="plot" hidden>
        <img id="benchmark-chart" alt="Held-out hit rates by benchmark arm with confidence intervals" loading="lazy">
      </figure>
      <div id="benchmark-report" class="benchmark-report"></div>
    </section>
  </main>
</body>
</html>
